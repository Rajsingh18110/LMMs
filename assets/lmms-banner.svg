<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
  <!-- Background with subtle dark radial glow -->
  <rect width="1200" height="420" fill="#050505"/>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="wingGrad1" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="wingGrad2" x1="100" y1="100" x2="0" y2="0">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="coreShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bgGlow)"/>

  <!-- Official Winged Diamond Mark centered at x=600, y=130 scaled by 1.6 -->
  <g transform="translate(520, 36) scale(1.6)">
    <!-- Wings -->
    <path d="M15 50 L45 20 L45 80 Z" fill="url(#wingGrad1)" />
    <path d="M85 50 L55 20 L55 80 Z" fill="url(#wingGrad2)" />
    <!-- Core Diamond with glow & stroke -->
    <path d="M50 12 L75 50 L50 88 L25 50 Z" fill="url(#coreGrad)" filter="url(#coreShadow)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="600" y="245" font-size="54" font-weight="800" fill="url(#textGrad)" letter-spacing="4">LMMs OS</text>
    <text x="600" y="295" font-size="20" font-weight="500" fill="#38bdf8" letter-spacing="3">BUILD WITH MODELS. SHIP WITH AGENTS.</text>
    <text x="600" y="340" font-size="14" font-weight="600" fill="#64748b" letter-spacing="6">POWERED BY MARKANM · LOCAL AI OPERATING SYSTEM</text>
    <line x1="420" y1="365" x2="780" y2="365" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="600" y="390" font-size="13" font-weight="500" fill="#94a3b8">https://lmms.markanm.com</text>
  </g>
</svg>
