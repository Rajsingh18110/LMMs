name: Build OS Apps

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller rich requests

    - name: Build All-in-One Application
      run: |
        pyinstaller --onefile --name LMMs-${{ matrix.os }} lmms_launcher.py

    - name: Build Engine Application
      run: |
        pyinstaller --onefile --name LMMs-Engine-${{ matrix.os }} lmms/lmmsengine/main.py

    - name: Build Backend Application
      run: |
        pyinstaller --onefile --name LMMs-Backend-${{ matrix.os }} lmms/backend/main.py

    - name: Build GUI Application
      run: |
        pyinstaller --onefile --name LMMs-GUI-${{ matrix.os }} lmms_gui_entry.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LMMs-${{ matrix.os }}
        path: dist/LMMs*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
