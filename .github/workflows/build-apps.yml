name: Build OS Apps

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller rich requests
        pip install -r requirements.txt

    - name: Build All-in-One Application
      run: |
        pyinstaller --onefile --name LMMs-${{ matrix.os }} --hidden-import nest_asyncio --hidden-import uvicorn --hidden-import fastapi --hidden-import PyQt6 --hidden-import qasync --exclude-module torch --exclude-module torchvision --exclude-module torchaudio --exclude-module transformers --exclude-module accelerate lmms_launcher.py

    - name: Build Engine Application
      run: |
        pyinstaller --onefile --name LMMs-Engine-${{ matrix.os }} --hidden-import nest_asyncio --hidden-import uvicorn --hidden-import fastapi --exclude-module torch --exclude-module torchvision --exclude-module torchaudio --exclude-module transformers --exclude-module accelerate lmms/lmmsengine/main.py

    - name: Build Backend Application
      run: |
        pyinstaller --onefile --name LMMs-Backend-${{ matrix.os }} --hidden-import nest_asyncio lmms/backend/main.py

    - name: Build GUI Application
      run: |
        pyinstaller --onefile --name LMMs-GUI-${{ matrix.os }} --hidden-import PyQt6 --hidden-import qasync lmms_gui_entry.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LMMs-${{ matrix.os }}
        path: dist/LMMs*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Delete old release and tag
        run: |
          gh release delete latest --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        run: |
          gh release create latest dist/* --title "Latest Build" --notes "Automated build of the LMMs ecosystem."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
